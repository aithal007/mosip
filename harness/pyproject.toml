[project]
name = "inji-conformance-gate"
version = "0.1.0"
description = "Automated OpenID conformance testing harness for Inji Certify and Inji Verify"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = [
    "httpx>=0.27",
    "pyparsing>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
icg = "icg.cli:main"

[tool.setuptools.packages.find]
include = ["icg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
