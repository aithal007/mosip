name: Full-stack OpenID conformance

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  schedule:
    - cron: "30 1 * * *" # nightly, catches upstream image changes
  workflow_dispatch:
    inputs:
      certify_image:
        description: Inji Certify image to test
        default: injistack/inji-certify-with-plugins:1.0.0-alpha.1
      verify_image:
        description: Inji Verify image to test
        default: injistack/inji-verify-service:1.0.0-alpha.1
      readiness:
        description: Also run HAIP plans whose capabilities are supported
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r harness/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: harness
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q verify
        working-directory: testrig/conformance-bridge

  conformance:
    name: ${{ matrix.name }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Inji Certify (OID4VCI issuer)
            args: --component certify
            slug: certify
          - name: Inji Verify (OID4VP verifier)
            args: --component verify
            slug: verify
          - name: Combined Certify + Verify
            args: --combined --parallel
            slug: combined
    env:
      INJI_CERTIFY_IMAGE: ${{ inputs.certify_image || 'injistack/inji-certify-with-plugins:1.0.0-alpha.1' }}
      INJI_VERIFY_IMAGE: ${{ inputs.verify_image || 'injistack/inji-verify-service:1.0.0-alpha.1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt

      - name: Install harness requirements
        run: pip install -r harness/requirements.txt

      - name: Resolve pinned versions
        id: versions
        run: |
          grep -E '^[A-Z_]+=' deploy/versions.env >> "$GITHUB_OUTPUT"

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('deploy/versions.env') }}

      - name: Restore previous baseline
        uses: actions/cache/restore@v4
        with:
          path: results/baseline-results.json
          key: conformance-baseline-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: conformance-baseline-${{ matrix.slug }}-

      - name: Run conformance
        id: run
        run: |
          set +e
          ./run-conformance.sh ${{ matrix.args }} ${{ inputs.readiness && '--readiness' || '' }} --update-baseline --down
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Locate run directory
        id: dir
        if: always()
        run: echo "path=$(ls -d results/2* 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always() && steps.dir.outputs.path != ''
        run: cat "${{ steps.dir.outputs.path }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Save baseline
        if: always() && steps.run.outputs.exit == '0'
        uses: actions/cache/save@v4
        with:
          path: results/baseline-results.json
          key: conformance-baseline-${{ matrix.slug }}-${{ github.run_id }}

      - name: Upload reports
        if: always() && steps.dir.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.slug }}
          path: |
            ${{ steps.dir.outputs.path }}/*.html
            ${{ steps.dir.outputs.path }}/*.json
            ${{ steps.dir.outputs.path }}/*.md
            ${{ steps.dir.outputs.path }}/*.svg
            ${{ steps.dir.outputs.path }}/*.xml
            ${{ steps.dir.outputs.path }}/logs/
            ${{ steps.dir.outputs.path }}/exports/
          retention-days: 30

      - name: Publish test results
        if: always() && steps.dir.outputs.path != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ${{ steps.dir.outputs.path }}/junit.xml
          check_name: OpenID conformance (${{ matrix.slug }})
          comment_mode: off

      - name: Enforce gate
        if: always()
        run: |
          code="${{ steps.run.outputs.exit }}"
          case "$code" in
            0) echo "Conformance gate passed" ;;
            1) echo "::error::Conformance regression against the benchmark"; exit 1 ;;
            *) echo "::error::Conformance infrastructure error (exit $code)"; exit 1 ;;
          esac

  attest:
    name: Sign conformance attestation
    needs: conformance
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Sigstore signing with the workflow identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r harness/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: conformance-combined
          path: combined
      - name: Build in-toto Test Result statement
        run: |
          set -euo pipefail
          subjects=()
          for image in "${{ inputs.certify_image || 'injistack/inji-certify-with-plugins:1.0.0-alpha.1' }}" "${{ inputs.verify_image || 'injistack/inji-verify-service:1.0.0-alpha.1' }}"; do
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            subjects+=(--subject "${image%%:*}=${digest}")
          done
          PYTHONPATH=harness python -m icg attest --results combined/results.json "${subjects[@]}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --out attestation.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign-blob --yes --bundle attestation.sigstore.json attestation.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-attestation
          path: |
            attestation.json
            attestation.sigstore.json
