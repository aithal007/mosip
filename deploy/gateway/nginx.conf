# TLS gateway in front of Inji for the conformance suite.
# The suite trusts any certificate, so a self-signed cert (scripts/gen-certs.sh) is enough.
#
# Upstreams are resolved at request time through Docker's DNS, so the gateway starts
# even when only one component's compose profile is running.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------- Inji Certify
server {
    listen 443 ssl;
    server_name certify.inji.test;
    ssl_certificate     /etc/nginx/certs/inji.test.crt;
    ssl_certificate_key /etc/nginx/certs/inji.test.key;

    set $certify http://certify:8090;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;

    location /v1/certify/ { proxy_pass $certify; }

    # credential_issuer is https://certify.inji.test/v1/certify, so OID4VCI 1.0 section 12.2.2
    # places its metadata at the path-inserted URL below. Inji Certify serves it under the
    # servlet path instead (inji-certify#967); this route bridges the gap and the gap is
    # reported in the certification-readiness section rather than hidden.
    location = /.well-known/openid-credential-issuer/v1/certify {
        proxy_pass $certify/v1/certify/.well-known/openid-credential-issuer;
    }
    location = /.well-known/openid-credential-issuer {
        proxy_pass $certify/v1/certify/.well-known/openid-credential-issuer;
    }
    # Authorization server = https://certify.inji.test (built-in AS used for pre-authorized codes).
    #
    # COMPATIBILITY SHIM (listed in conformance/plans/certify.json "shims" and in every report):
    # Inji Certify 1.0.0-alpha.1 advertises the authorization_code grant but omits
    # authorization_endpoint, which RFC 8414 section 2 then requires. The suite aborts every
    # issuance module during setup on that single gap, so the credential, nonce and token
    # endpoints would never be exercised. The shim adds a placeholder authorization_endpoint
    # (never called in the pre-authorized code flow) so the remaining behaviour can be tested.
    location = /.well-known/oauth-authorization-server {
        proxy_pass $certify/v1/certify/.well-known/oauth-authorization-server;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"token_endpoint":' '"authorization_endpoint":"https://certify.inji.test/v1/certify/authorize-not-supported","token_endpoint":';
    }
    location = /.well-known/oauth-authorization-server/v1/certify {
        return 301 /.well-known/oauth-authorization-server;
    }
    location = /.well-known/jwks.json { proxy_pass $certify/v1/certify/.well-known/jwks.json; }
    location = /.well-known/did.json  { proxy_pass $certify/v1/certify/.well-known/did.json; }
    # did:web:certify.inji.test:v1:certify resolves to /v1/certify/did.json
    location = /v1/certify/did.json   { proxy_pass $certify/v1/certify/.well-known/did.json; }
}

# ---------------------------------------------------------------- Inji Verify
server {
    listen 443 ssl;
    server_name verify.inji.test;
    ssl_certificate     /etc/nginx/certs/inji.test.crt;
    ssl_certificate_key /etc/nginx/certs/inji.test.key;

    set $verify http://verify-service:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;

    location /v1/verify/ { proxy_pass $verify; }
}
