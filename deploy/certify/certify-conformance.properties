# Overrides applied on top of the upstream docker-compose-injistack configuration
# (active profiles: default, csvdp-farmer, conformance - later profiles win).

# Public https origin the conformance suite dereferences (served by the gateway).
mosip.certify.domain.url=https://certify.inji.test
mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.data-provider-plugin.did-url=did:web:certify.inji.test:v1:certify

# Use Inji Certify's built-in authorization server (pre-authorized code grant) instead of
# the remote eSignet mock, so the stack is self-contained and deterministic in CI.
mosip.certify.authorization.url=https://certify.inji.test
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
# Fetched by Certify itself, so use the in-network http address (no self-signed TLS trust needed).
mosip.certify.authn.jwk-set-uri=http://certify:8090/v1/certify/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential' }
mosip.certify.oauth.access-token.audience=${mosip.certify.domain.url}${server.servlet.path}/issuance/credential

# Offers are fetched by the suite's wallet from the public origin.
mosip.certify.credential-offer-url=${mosip.certify.domain.url}${server.servlet.path}/credential-offer-data/
