#---------------------------------- OpenID conformance (append to injiCertify.properties / injiVerify.properties) ----------------------------------#
# Every key can be overridden by an environment variable of the same name (ConfigManager convention),
# which is how the apitestrig Helm chart / ConfigMaps inject values.

# yes | no - run the OpenID conformance suite as part of this testrig
conformanceEnabled = yes

# Directory containing the Inji Conformance Gate checkout (harness/, conformance/, upstream/).
# In the testrig Docker image this is /home/inji/conformance-harness.
conformanceHarnessHome = /home/inji/conformance-harness

# Python interpreter with harness/requirements.txt installed
conformancePython = python3

# OpenID conformance suite base URL (local suite in dev mode needs no token; set CONFORMANCE_TOKEN for a hosted suite)
conformanceServer = https://localhost.emobix.co.uk:8443/

# Public https URL of the component as the conformance suite reaches it.
# Leave empty to use the same URL the testrig already targets (env.endpoint / injiVerifyBaseUrl).
conformancePublicBaseUrl =

# Use an existing results.json instead of running the suite (e.g. produced by the CI job)
conformanceResultsFile =

# Where the harness writes results and logs
conformanceOutputDir = /home/inji/testrig/report/conformance

conformanceTimeoutMinutes = 90

# resolve | pass | fail - how suite REVIEW results count (resolve = compare with Inji's own verification result)
conformanceReviewPolicy = resolve

# yes | no - register the SD-JWT test credential configuration in Inji Certify before running (Certify only)
conformanceSeedCertify = yes
